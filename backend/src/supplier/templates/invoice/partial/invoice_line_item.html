<div class="flex m-5 gap-4 max-sm:gap-2">
    <input type="hidden" name="product_{{  product.pk }}" value="{{  product.pk }}">
    <span class="bg-stone-950 text-gray-500 py-1 px-3 rounded-lg w-36">{{  product.name }}</span>
    <span class="py-1 px-3 rounded-lg w-36 bg-stone-950 text-gray-500 max-sm:invisible">En stock: {{  product.quantity }}</span>
    <input class="bg-stone-950 text-gray-500 h-8 w-28 rounded-lg" placeholder="Quantité" type="number" name="quantity_{{  product.pk }}" value="{{  quantity }}">
    <input class="bg-stone-950 text-gray-500 h-8 w-28 rounded-lg" placeholder="Prix" type="number" step="0.01" name="price_{{  product.pk }}" value="{{  price }}">
    <button onclick="removeItem(this)">
        <img width="16" height="16" src=" {% static 'trash.png' %} " alt="cancel"/>
    </button>
</div>
