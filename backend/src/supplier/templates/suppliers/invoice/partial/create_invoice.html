{% load humanize %}

<div id="invoice" class="flex space-x-2 max-sm:grid grid-rows-2 gap-2">
    <div  class="max-sm:w-full mx-auto bg-gray-700 h-full w-1/3 rounded-md border-white border-2 p-3 sm:flex-col"  >
        <div id="">
            
            <div id="search" class="my-5 mx-auto flex flex-col">
                <h4 class="text-center font-semibold font-serif">Rechercher Produit</h4>
                <form action="" method="get" class="mx-auto w-96">
                    {% csrf_token %}
                    <input  autocomplete="off"
                            hx-post="{% url 'search:product' %}"
                            hx-trigger="keyup delay:300ms"
                            hx-target="#product"
                            type="text" name="search"  class=" w-96  rounded-lg text-black">
                </form>
            </div>
            <div id="product"  >
<!--                <form action="" method="post" class="flex">-->
<!--                    {{form.as_p}}-->
<!--                </form>-->
                <table class="w-full">
                    <thead>
                        <tr class=>
                            <th class="">Produits</th>
<!--                            <th class="">Quantité</th>-->
                            <th class="">Ajouter</th>
                        </tr>
                    </thead>
                    <tbody>
                    {% for prod in products %}
                        <tr class="">
                            <td class="border-none">
                                {{prod.name}}
                            </td>
<!--                            <td class="border-none">-->
<!--                                {{prod.price|intcomma}}-->
<!--                            </td>-->
<!--                            <td class="border-none">-->
<!--                                <input type="number" name="quantity" class="w-28 rounded-md" placeholder="Quantité">-->
<!--                            </td>-->
                            <td class="border-none">
                                <a hx-get="{% url 'supplier:add_line' prod.pk %}"
                                   hx-target="#invoice-line"
                                   hx-swap="beforeend"
                                   class="font-medium text-blue-600 dark:text-blue-500 hover:bg-green-400 hover:text-black hover:rounded-lg hover:p-1 hover:w-5">Ajouté</a>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div  class="max-sm:w-full max-sm:mt-5 bg-blue-950 w-2/3 rounded-md border-white border-2 p-3 max-h-screen"  >
        <form id="invoice-form" method="POST" action="{% url 'supplier:create_invoice' %}">
            {% csrf_token %}

                <table >
                    <tbody>
                            <div id="invoice-line" >

                            </div>
                    </tbody>
                </table>

            <button 
                class="font-medium text-blue-600 dark:text-blue-500 hover:bg-green-400 hover:text-black hover:rounded-lg hover:p-1 hover:w-32"
                type="submit">Enregistrer</button>
        </form>

    </div>
</div>
