<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
        <caption class="text-2l font-bold dark:text-white text-black "> {{ cat.name }} : <span>{{ qtite }} unité(s)</span></caption>
        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
            <tr>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Categorie
                </th>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Nom
                </th>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Quantité
                </th>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Unité
                </th>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Prix
                </th>
                <th scope="col" class="px-6 py-3 max-sm:text-sm">
                    Action
                </th>
            </tr>
        </thead>
        <tbody>
            {% for prod in product %}
                <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                <td scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                    {{ prod.category|capfirst }}
                </td>
                <td class="px-6 py-4">
                    {{ prod.name|capfirst }}
                </td>
                <td class="px-6 py-4">
                    {{ prod.quantity }}
                </td>
                <td class="px-6 py-4">
                    {{ prod.unity }}
                </td>
                <td class="px-6 py-4">
                    {{ prod.price }}
                </td>

                <th class="px-6 py-4 text-right space-x-2">
                     <a href="{% url 'product:delete' prod.pk %} " class=" hover:bg-red-500 hover:p-1 hover:rounded-lg"> Supprimer </a>
                     <a href="{% url 'product:update' prod.pk %} " class="font-medium text-blue-600 dark:text-blue-500 hover:bg-green-400 hover:text-black hover:rounded-lg hover:p-1 hover:w-5"> Modifier </a>
                </th>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
