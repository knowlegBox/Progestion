
<form method="post" hx-post="{% url 'product:create_command' %} " >
        {% csrf_token %}
        <div class="text-black flex space-y-3 space-x-2  mx-auto">
            {{form}}
            <button
                    hx-target="#commande"
                    hx-swap="afterend"
                    type="submit"
                    class="relative inline-flex items-center justify-center p-0.5 mb-2 me-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-cyan-500 to-blue-500 group-hover:from-cyan-500 group-hover:to-green-400 hover:text-white dark:text-white focus:ring-4 focus:outline-none focus:ring-cyan-200 dark:focus:ring-cyan-800">
                <span class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white dark:bg-gray-900 rounded-md group-hover:bg-opacity-0">
                    Enregistrer
                </span>
            </button>
        </div>
</form>
